<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 纸质微质感与主背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFA"/>
      <stop offset="100%" stop-color="#F4F4F0"/>
    </linearGradient>

    <!-- 典雅深青墨色渐变 (Deep Slate Obsidian) -->
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- 认知火花与伴读流光 (Cognitive Amber Gold) -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- 智慧微光高亮 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- 图标柔和投射阴影 -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <filter id="sparkleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ========================================================================= -->
  <!-- 1. 外画板底座：连续超椭圆 (Squircle) + 细腻轻量描边                           -->
  <!-- ========================================================================= -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="2.5"/>
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

  <!-- ========================================================================= -->
  <!-- 2. 核心图腾：沉浸开卷书叶 (Open Folio) 与 知识图谱神经经纬                      -->
  <!-- ========================================================================= -->
  <g transform="translate(0, 8)" filter="url(#softShadow)">

    <!-- 左侧优雅翻开书叶 (Left Page Wing) -->
    <path d="M 256 368
             C 216 348, 148 336, 96 352
             C 84 356, 76 346, 76 334
             L 76 156
             C 76 144, 86 134, 98 132
             C 148 122, 216 138, 256 164 Z"
          fill="url(#inkGrad)"/>

    <!-- 右侧优雅翻开书叶 (Right Page Wing) -->
    <path d="M 256 368
             C 296 348, 364 336, 416 352
             C 428 356, 436 346, 436 334
             L 436 156
             C 436 144, 426 134, 414 132
             C 364 122, 296 138, 256 164 Z"
          fill="url(#inkGrad)"/>

    <!-- 中缝书脊立体基线 (Spine Baseline) -->
    <path d="M 256 164 L 256 376" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>

    <!-- 左页内层排版经纬与知识切线 (Editorial Paragraph Lines) -->
    <path d="M 112 188 C 150 178, 198 188, 228 202" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 112 226 C 150 216, 198 226, 228 240" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 112 264 C 150 254, 198 264, 228 278" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 112 302 C 145 294, 185 300, 210 312" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

    <!-- 右页内层排版经纬 (Editorial Paragraph Lines - Right) -->
    <path d="M 400 188 C 362 178, 314 188, 284 202" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 400 226 C 362 216, 314 226, 284 240" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 400 264 C 362 254, 314 264, 284 278" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M 400 302 C 367 294, 327 300, 302 312" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

    <!-- 边注锚点微标 [※] (iA Writer Marginalia Mark) -->
    <circle cx="376" cy="188" r="4.5" fill="#F59E0B"/>
    <circle cx="376" cy="226" r="4.5" fill="#6366F1"/>

  </g>

  <!-- ========================================================================= -->
  <!-- 3. AI 深度认知核心：居中升腾的四芒几何智火 (The Cognitive Singularity)         -->
  <!-- ========================================================================= -->
  <g transform="translate(256, 126)" filter="url(#sparkleGlow)">
    <!-- 核心四芒星 (Geometric 4-Point Sparkle) -->
    <path d="M 0 -54
             C 0 -16, 16 0, 54 0
             C 16 0, 0 16, 0 54
             C 0 16, -16 0, -54 0
             C -16 0, 0 -16, 0 -54 Z"
          fill="url(#sparkleGrad)"/>

    <!-- 中心纯白聚光高亮 (Center Hotspot) -->
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. NLP 概念网络微型拓扑卫星 (Knowledge Graph Constellation)                  -->
  <!-- ========================================================================= -->
  <!-- 左上概念卫星节点 -->
  <circle cx="168" cy="98" r="7" fill="#6366F1"/>
  <line x1="174" y1="102" x2="216" y2="120" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- 右上概念卫星节点 -->
  <circle cx="344" cy="98" r="7" fill="#8B5CF6"/>
  <line x1="338" y1="102" x2="296" y2="120" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- 顶部中心思维导图脉络微节点 -->
  <circle cx="256" cy="46" r="4" fill="#F59E0B" opacity="0.8"/>
  <line x1="256" y1="52" x2="256" y2="68" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>

</svg>
